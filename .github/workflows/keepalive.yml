name: Keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ledgerly-finance-one.vercel.app' }}
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$SITE_URL/api/health"
