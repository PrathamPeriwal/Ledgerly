name: Keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ledgerly-finance-one.vercel.app' }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then sleep 20; fi
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "$SITE_URL/api/health")
            echo "health $code"
            if [ "$code" != "200" ] || ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/health.json; then
              echo "health check failed"
              exit 1
            fi
          done

      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Only the publishable or anon key may ever be used here. Never a service-role or secret key.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is unset; skipping"
            exit 0
          fi
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then sleep 20; fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/users?select=id&limit=1")
            echo "supabase $code"
            if [ "$code" -ge 500 ]; then
              echo "supabase rest failed"
              exit 1
            fi
          done

      - name: Re-sync Inngest
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ledgerly-finance-one.vercel.app' }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/inngest-sync.json -w "%{http_code}" --max-time 60 -X PUT "$SITE_URL/api/inngest")
          echo "inngest $code"
          if [ "$code" -ge 400 ]; then
            echo "inngest sync failed"
            exit 1
          fi
